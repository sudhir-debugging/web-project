<Doctype html>
    <html>

    <head>
        <title>Multiplication of Table priting</title>

    <body>
        <script>
            n = Number(prompt("Enter no"));
            for (i = 1; i <= 10; i++) {
                document.write(n + "*" + i + "=" + n * i + "<br>");
            }

        </script>
    </body>
    </head>

    </html>
